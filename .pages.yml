media:

  input: imag

  output: /imag


content:

  - name: hinweis

    label: نوار هشدار قرمز (Wichtiger Hinweis)

    type: file

    path: data/hinweis.json

    fields:

      - name: active

        label: نمایش نوار هشدار در سایت

        type: boolean

        default: true

      - name: text

        label: متن هشدار (آلمانی)

        type: string

      - name: link

        label: لینک جزئیات بیشتر (اختیاری)

        type: string


  - name: aktuelles

    label: اخبار و اطلاعیه‌ها (Aktuelles)

    type: file

    path: data/news.json

    fields:

      - name: items

        label: لیست خبرها

        type: object

        list: true

        fields:

          - name: date

            label: تاریخ انتشار (مثلاً 27.11.2026)

            type: string

          - name: title

            label: تیتر خبر

            type: string

          - name: summary

            label: خلاصه کوتاه خبر (نمایش در کارت)

            type: text

          - name: details

            label: متن کامل خبر (نمایش در پنجره بازشو)

            type: text


  - name: galerie

    label: گالری تصاویر و رویدادها (Bildergalerie)

    type: file

    path: data/galerie.json

    fields:

      - name: events

        label: لیست جشن‌ها و رویدادها (DSGVO-Hinweis: Bitte nur Fotos mit vorliegender Einwilligungserklärung hochladen!)

        type: object

        list: true

        fields:

          - name: date

            label: تاریخ یا سال رویداد (مثلاً Juli 2026)

            type: string

          - name: title

            label: عنوان رویداد (مثلاً Entlassfeier / Abschlussfeier)

            type: string

          - name: description

            label: توضیح کوتاه درباره رویداد

            type: text

          - name: photos

            label: عکس‌های رویداد (انتخاب و آپلود از دستگاه)

            type: image

            list: true
