media:

  input: imag

  output: /imag



content:

  - name: hinweis

    label: نوار هشدار قرمز (Wichtiger Hinweis)

    type: file

    path: data/hinweis.json

    fields:

      - name: active

        label: نمایش نوار هشدار در سایت

        type: boolean

        default: true

      - name: text

        label: متن هشدار (آلمانی)

        type: string

      - name: link

        label: لینک جزئیات بیشتر (اختیاری)

        type: string



  - name: aktuelles

    label: اخبار و اطلاعیه‌ها (Aktuelles)

    type: file

    path: data/news.json

    fields:

      - name: items

        label: لیست خبرها

        type: object

        list: true

        fields:

          - name: date

            label: تاریخ انتشار (مثلاً 27.11.2026)

            type: string

          - name: title

            label: تیتر خبر

            type: string

          - name: summary

            label: خلاصه کوتاه خبر (نمایش در کارت)

            type: text

          - name: details

            label: متن کامل خبر (نمایش در پنجره بازشو)

            type: text

