media:

  input: imag

  output: /imag


content:

  - name: hinweis

    label: Wichtiger Hinweis (Roter Banner)

    type: file

    path: data/hinweis.json

    fields:

      - name: active

        label: Hinweis-Banner auf der Website anzeigen

        type: boolean

        default: true

      - name: text

        label: Hinweistext

        type: string

      - name: link

        label: Link für weitere Details (optional)

        type: string


  - name: aktuelles

    label: Aktuelles & Neuigkeiten

    type: file

    path: data/news.json

    fields:

      - name: items

        label: Beitragsliste

        type: object

        list: true

        fields:

          - name: date

            label: Datum (z. B. 27. November 2026)

            type: string

          - name: title

            label: Überschrift

            type: string

          - name: summary

            label: Kurzfassung (Vorschau auf der Startseite)

            type: text

          - name: details

            label: Vollständiger Text (im Pop-up-Fenster)

            type: text


  - name: galerie 

    label: Bildergalerie & Veranstaltungen

    type: file

    path: data/galerie.json

    fields:

      - name: events

        label: Veranstaltungen & Feste (Bitte DSGVO-Einwilligung beachten)

        type: object

        list: true

        fields:

          - name: date

            label: Datum oder Zeitraum

            type: string

          - name: title

            label: Titel der Veranstaltung

            type: string

          - name: description

            label: Kurze Beschreibung

            type: text

          - name: photos

            label: Fotos auswählen & hochladen

            type: image

            list: true
             - name: termine
label: Terminkalender & Schuljahrestermine
type: file
path: data/termine.json
fields:
- name: termine
label: Termine im Schuljahr
type: object
list: true
fields:
- name: date
label: Datum oder Zeitraum
type: string
- name: title
label: Termin oder Veranstaltung
type: string
- name: category
label: Kategorie (Ferien, Eltern, Prüfung, Fest)
type: string
- name: info
label: Zusätzliche Informationen
type: string 



            
