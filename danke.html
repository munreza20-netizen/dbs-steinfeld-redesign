<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krankmeldung übermittelt – Don-Bosco-Schule Steinfeld</title>
<link rel="stylesheet" href="https://cloudflare.com"/>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #f1f5f9;
margin: 0;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
padding: 20px;
box-sizing: border-box;
}
.thank-card {
background: #ffffff;
max-width: 480px;
width: 100%;
padding: 40px 30px;
border-radius: 16px;
box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
text-align: center;
border-top: 6px solid #16a34a;
}
.icon-circle {
width: 72px;
height: 72px;
background-color: #dcfce7;
color: #16a34a;
border-radius: 50%;
display: flex;
justify-content: center;
align-items: center;
font-size: 36px;
margin: 0 auto 20px auto;
}
h1 {
color: #1e293b;
font-size: 22px;
margin-bottom: 12px;
}
p {
color: #475569;
font-size: 15px;
line-height: 1.6;
margin-bottom: 28px;
}
.back-btn {
display: inline-flex;
align-items: center;
gap: 8px;
background-color: #0d47a1;
color: #ffffff;
text-decoration: none;
padding: 12px 24px;
border-radius: 8px;
font-weight: 600;
font-size: 15px;
transition: background 0.2s;
}
.back-btn:hover {
background-color: #1565c0;
}
</style>
</head>
<body>
<div class="thank-card">
<div class="icon-circle">
<i class="fas fa-check"></i>
</div>
<h1>Vielen Dank!</h1>
<p>
Ihre Krankmeldung wurde <strong>erfolgreich</strong> an das Sekretariat der Don-Bosco-Schule Steinfeld übermittelt.
</p>
<a href="./index.html" class="back-btn">
<i class="fas fa-arrow-left"></i> Zurück zur Startseite
</a>
</div>
</body>
</html>
